[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vishield"
version = "0.1.0"
description = "ViShield - Explainable Voice Phishing Detection and Awareness Platform (academic defensive prototype)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "ViShield Student Team" }]
keywords = ["vishing", "phishing", "security-awareness", "explainable-ml", "academic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0,<3.0",
  "scikit-learn>=1.4,<2.0",
  "numpy>=1.26,<3.0",
  "joblib>=1.3",
  "librosa>=0.10,<0.12",
  "soundfile>=0.12",
  "streamlit>=1.33,<2.0",
  "plotly>=5.20,<6.0",
  "pandas>=2.2,<3.0",
  "requests>=2.31,<3.0",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0,<2.0"]
research = ["transformers>=4.40", "torch>=2.2"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.9",
  "pip-audit>=2.7",
  "types-requests",
  "pandas-stubs",
]

[project.scripts]
vishield-api = "vishield.api.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vishield = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "W", "SIM", "RUF"]
ignore = ["S101", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"src/vishield/domain/rules.py" = ["E501"]
"src/vishield/domain/redaction.py" = ["E501"]
"src/vishield/dashboard/**" = ["E501", "RUF001"]
"scripts/**" = ["S603", "S607"]
"scripts/push_grafana_dashboard.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
ignore_missing_imports = true
mypy_path = "src"
packages = ["vishield"]
exclude = ["src/vishield/dashboard/"]

[[tool.mypy.overrides]]
module = ["prometheus_client", "prometheus_client.*", "librosa", "librosa.*", "soundfile", "sklearn", "sklearn.*", "joblib", "plotly", "plotly.*", "streamlit", "streamlit.*", "faster_whisper"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: tests touching more than one layer",
  "slow: tests that take longer than a second",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*httpx.*starlette.*:DeprecationWarning", "ignore::starlette.testclient.StarletteDeprecationWarning"]

[tool.coverage.run]
source = ["vishield"]
branch = true
omit = ["src/vishield/dashboard/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
