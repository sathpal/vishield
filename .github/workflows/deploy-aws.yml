name: Deploy to AWS

on:
  push:
    branches: [cloud/aws]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to deploy (rollback). Leave empty to build and deploy this commit."
        required: false
        default: ""

permissions:
  id-token: write # OIDC token to assume the AWS deploy role
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'vishield' }}

jobs:
  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform -chdir=deploy/aws/terraform fmt -check -recursive
      - run: terraform -chdir=deploy/aws/terraform init -backend=false
      - run: terraform -chdir=deploy/aws/terraform validate

  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    needs: terraform
    # Runs only once the repository variable AWS_DEPLOY_ROLE_ARN is set (after terraform apply).
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    steps:
      - uses: actions/checkout@v4

      - name: Assume the deploy role through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Choose the image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.tag.outputs.build == 'true'

      - name: Build and push the image
        if: steps.tag.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Find the instance
        id: instance
        run: |
          ID="${{ vars.EC2_INSTANCE_ID }}"
          if [ -z "$ID" ]; then
            ID=$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=${{ vars.PROJECT_NAME || 'vishield' }}" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" --output text)
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Deploy through SSM Run Command
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.id }}" \
            --document-name AWS-RunShellScript \
            --comment "vishield deploy ${{ steps.tag.outputs.tag }}" \
            --parameters "commands=[\"/opt/vishield/deploy.sh ${{ steps.tag.outputs.tag }}\"]" \
            --query "Command.CommandId" --output text)
          echo "command $CMD_ID"
          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "${{ steps.instance.outputs.id }}" --query Status --output text 2>/dev/null || echo Pending)
            echo "$STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut) aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ steps.instance.outputs.id }}" --query StandardErrorContent --output text; exit 1 ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ steps.instance.outputs.id }}" --query StandardOutputContent --output text

      - name: Smoke test
        if: vars.APP_URL != ''
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${{ vars.APP_URL }}/api/health"; then exit 0; fi
            sleep 5
          done
          echo "health check failed"; exit 1
