<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 200" width="1270" height="200" role="img" aria-label="From the fictional dataset to reproducible metrics: validate, split, train, evaluate, with CI gating every push." font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" style="color:#1c2430">
<rect width="100%" height="100%" fill="#fbfbf9"/>
<defs>
  <marker id="arw3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
</defs>
<g fill="currentColor" fill-opacity="0.045" stroke="currentColor" stroke-width="1.2">
  <rect x="20" y="20" width="150" height="60" rx="6"/>
  <rect x="200" y="20" width="150" height="60" rx="6"/>
  <rect x="380" y="20" width="150" height="60" rx="6"/>
  <rect x="560" y="20" width="150" height="60" rx="6"/>
  <rect x="740" y="20" width="150" height="60" rx="6" stroke-dasharray="5 4"/>
  <rect x="920" y="20" width="150" height="60" rx="6"/>
  <rect x="1100" y="20" width="150" height="60" rx="6" stroke="#0f766e" stroke-width="2"/>
  <rect x="20" y="130" width="1230" height="48" rx="6"/>
</g>
<g fill="currentColor" font-size="12.5" font-weight="600">
  <text x="30" y="41">starter_dataset.jsonl</text>
  <text x="210" y="41">validate_dataset.py</text>
  <text x="390" y="41">split_dataset.py</text>
  <text x="570" y="41">train_model.py</text>
  <text x="750" y="41">tfidf_logreg.joblib</text>
  <text x="930" y="41">evaluate_model.py</text>
  <text x="1110" y="41" fill="#0f766e">reports/metrics.json</text>
  <text x="30" y="150">Every push and pull request runs CI</text>
</g>
<g fill="currentColor" fill-opacity="0.85" font-size="11">
  <text x="30" y="58">80 fictional transcripts</text>
  <text x="30" y="72">10 categories, CC0</text>
  <text x="210" y="58">schema · duplicates</text>
  <text x="210" y="72">PII patterns · org names</text>
  <text x="390" y="58">stratified 50 / 10 / 20</text>
  <text x="390" y="72">seed 42, deterministic</text>
  <text x="570" y="58">TF-IDF + LR on train</text>
  <text x="570" y="72">seconds on a laptop</text>
  <text x="750" y="58">models/, git-ignored</text>
  <text x="750" y="72">rebuilt in Docker image</text>
  <text x="930" y="58">rules vs ML vs hybrid</text>
  <text x="930" y="72">on the test split only</text>
  <text x="1110" y="58">P · R · F1 · AUC · confusion</text>
  <text x="1110" y="72">per-category accuracy</text>
  <text x="30" y="168">ruff lint + format · mypy --strict · pytest with coverage ≥ 70 % (STT mocked) · dataset validation · pip-audit · gitleaks secret scan · Docker build smoke test</text>
</g>
<g fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#arw3)">
  <line x1="170" y1="50" x2="196" y2="50"/>
  <line x1="350" y1="50" x2="376" y2="50"/>
  <line x1="530" y1="50" x2="556" y2="50"/>
  <line x1="710" y1="50" x2="736" y2="50"/>
  <line x1="890" y1="50" x2="916" y2="50"/>
  <line x1="1070" y1="50" x2="1096" y2="50"/>
</g>
<g fill="currentColor" fill-opacity="0.75" font-size="10.5" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <text x="275" y="100" text-anchor="middle">make data</text>
  <text x="635" y="100" text-anchor="middle">make train</text>
  <text x="995" y="100" text-anchor="middle">make evaluate</text>
  <text x="1175" y="100" text-anchor="middle">tune on val, report test once</text>
</g>
<g stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="2 3">
  <line x1="200" y1="88" x2="530" y2="88"/>
  <line x1="560" y1="88" x2="710" y2="88"/>
  <line x1="920" y1="88" x2="1070" y2="88"/>
</g>
</svg>
